
name: Build B866F Launcher from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "B866F-LAUNCHER.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Extract project ZIP
        run: unzip -q B866F-LAUNCHER.zip -d extracted

      - name: Build Debug APK
        run: gradle -p extracted/B866F-LAUNCHER :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: B866F-LAUNCHER-APK
          path: extracted/B866F-LAUNCHER/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          
